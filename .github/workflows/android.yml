name: Build MK Earnings APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "Android SDK: $SDK_ROOT"

          sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Check Android Project
        run: |
          echo "Project:"
          ls -la android/MKEarningsDemo

          echo ""
          echo "App:"
          ls -la android/MKEarningsDemo/app

      - name: Build Debug APK
        working-directory: android/MKEarningsDemo
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find android/MKEarningsDemo/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MK-Earnings-Debug-APK
          path: android/MKEarningsDemo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
