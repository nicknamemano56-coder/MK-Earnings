name: Build MK Earnings APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x android/MKEarningsDemo/gradlew

      - name: Build Debug APK
        working-directory: android/MKEarningsDemo
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MK-Earnings-Debug-APK
          path: android/MKEarningsDemo/app/build/outputs/apk/debug/app-debug.apk
