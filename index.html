<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK Earnings — Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#07101f;color:#eef4ff}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900}.tag{font-size:11px;color:#91a2c2}.card{background:#0d172b;border:1px solid #223455;border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 15px 50px #0005}.auth{max-width:430px;margin:8vh auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button,.btn{border:0;border-radius:12px;padding:12px 16px;background:#173057;color:#fff;font-weight:800}.tabs .active,.primary{background:#2477ff}.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #304567;background:#081221;color:#fff;margin:7px 0;outline:none}.msg{min-height:22px;font-size:13px;margin-top:8px}.hidden{display:none!important}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:150px;background:#091427;border:1px solid #243756;border-radius:14px;padding:14px}.small{font-size:11px;color:#8fa2c5}.big{font-size:22px;font-weight:900;margin-top:5px}.game{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:750px){.game{grid-template-columns:1fr}}.wheelbox{text-align:center}.wheel{width:min(72vw,370px);height:min(72vw,370px);margin:10px auto;border-radius:50%;border:10px solid #1e3152;position:relative;overflow:hidden;background:conic-gradient(#2485ff 0 90deg,#ff4c68 90deg 180deg,#2485ff 180deg 270deg,#f3c64f 270deg 315deg,#2485ff 315deg 360deg);box-shadow:0 0 45px #2477ff33}.wheel:before{content:"";position:absolute;inset:15%;border-radius:50%;border:2px dashed #ffffff55}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:#091426;border:5px solid #b8c9e7;display:grid;place-items:center;font-weight:900;z-index:3}.pointer{margin:auto;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid #fff;filter:drop-shadow(0 3px 4px #000);position:relative;z-index:4}.phase{font-size:14px;color:#a8b8d3}.result{font-size:34px;font-weight:1000;margin:12px}.choices{display:flex;gap:8px}.choice{flex:1;border:0;border-radius:12px;padding:13px;font-weight:900;color:white}.choice.big{background:#1677ff}.choice.small{background:#f04461}.choice.tie{background:#c28a17}.amounts{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.amount{border:1px solid #33496d;background:#101e35;color:#fff;border-radius:10px;padding:10px 15px}.amount.sel{background:#2477ff}.betrow{display:flex;gap:8px;margin-top:10px}.wallet{font-size:25px;font-weight:900;color:#8ff0ae}.records{max-height:320px;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:10px;border-bottom:1px solid #1d2b44;font-size:12px}.danger{background:#7c2635}.logout{float:right}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="brand">MK EARNINGS</div><div class="tag">Virtual demo • no real-money payments or payouts</div></div><button id="logout" class="btn danger hidden">Logout</button></div>
<div id="auth" class="card auth"><div class="tabs"><button id="loginTab" class="active">Login</button><button id="regTab">Register</button></div><div id="loginForm"><input id="lm" class="input" inputmode="numeric" maxlength="10" placeholder="10 digit mobile"><input id="lp" class="input" type="password" placeholder="Password"><button id="loginBtn" class="btn primary" style="width:100%">Login</button><div id="loginMsg" class="msg"></div></div><div id="regForm" class="hidden"><input id="rm" class="input" inputmode="numeric" maxlength="10" placeholder="10 digit mobile"><input id="rp" class="input" type="password" placeholder="Password (8+ characters)"><input id="rc" class="input" type="password" placeholder="Confirm password"><button id="regBtn" class="btn primary" style="width:100%">Create Account</button><div id="regMsg" class="msg"></div></div></div>
<div id="app" class="hidden">
<div class="stats"><div class="stat"><div class="small">GAME ID</div><div id="gameId" class="big">—</div></div><div class="stat"><div class="small">VIRTUAL BALANCE</div><div id="balance" class="wallet">₹0.00</div></div><div class="stat"><div class="small">ROUND</div><div id="round" class="big">—</div></div><div class="stat"><div class="small">TIME LEFT</div><div id="time" class="big">30.0s</div></div></div>
<div class="game"><div class="card wheelbox"><div class="pointer"></div><div id="wheel" class="wheel"><div class="hub">SPIN</div></div><div id="phase" class="phase">Waiting for round…</div><div id="result" class="result">—</div></div>
<div class="card"><h2>Place Demo Bet</h2><input id="name" class="input" placeholder="Player name"><div class="choices"><button class="choice big" data-c="BIG">BIG</button><button class="choice small" data-c="SMALL">SMALL</button><button class="choice tie" data-c="TIE">TIE</button></div><div class="amounts" id="amounts"></div><div class="betrow"><button id="bet" class="btn primary" style="flex:1">BET</button><button id="recordsBtn" class="btn" style="flex:1">Records</button></div><div id="status" class="msg">Select a result and amount.</div></div></div>
<div class="card"><h3>Records</h3><div id="records" class="records"><div class="small">No records yet.</div></div></div>
</div></div>
<script>
const API='https://mk-earnings-demo-backend.onrender.com';let token=localStorage.getItem('mk_demo_token')||'',choice='',amount=1,roundData=null,roundStart=0,roundEnd=0,currentRotation=0,lastRound=null,fastStart=0,fastFrom=0,targetRotation=0;
const $=id=>document.getElementById(id);const api=async(path,opt={})=>{const h={'Content-Type':'application/json',...(opt.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
function msg(el,t,ok=false){$(el).textContent=t;$(el).style.color=ok?'#8ff0ae':'#ff8797'}
function showApp(){ $('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');loadState();syncRound();}
function showAuth(){ $('auth').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');}
$('loginTab').onclick=()=>{$('loginTab').classList.add('active');$('regTab').classList.remove('active');$('loginForm').classList.remove('hidden');$('regForm').classList.add('hidden')};
$('regTab').onclick=()=>{$('regTab').classList.add('active');$('loginTab').classList.remove('active');$('regForm').classList.remove('hidden');$('loginForm').classList.add('hidden')};
$('regBtn').onclick=async()=>{const m=$('rm').value.trim(),p=$('rp').value,c=$('rc').value;if(!/^\d{10}$/.test(m))return msg('regMsg','Enter valid 10 digit mobile.');if(p.length<8)return msg('regMsg','Password must be 8+ characters.');if(p!==c)return msg('regMsg','Passwords do not match.');try{const d=await api('/api/register',{method:'POST',body:JSON.stringify({mobile:m,password:p})});msg('regMsg','Registered. Game ID: '+d.gameId,true);$('lm').value=m;$('loginTab').click()}catch(e){msg('regMsg',e.message)}};
$('loginBtn').onclick=async()=>{try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({mobile:$('lm').value.trim(),password:$('lp').value})});token=d.token;localStorage.setItem('mk_demo_token',token);showApp()}catch(e){msg('loginMsg',e.message)}};
$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch{}token='';localStorage.removeItem('mk_demo_token');showAuth()};
[1,5,10,15,20,50,100].forEach(v=>{const b=document.createElement('button');b.className='amount'+(v===1?' sel':'');b.textContent='₹'+v;b.onclick=()=>{amount=v;document.querySelectorAll('.amount').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};$('amounts').appendChild(b)});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{choice=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.style.opacity='.55');b.style.opacity='1';});
async function loadState(){try{const d=await api('/api/state');$('gameId').textContent=d.user.gameId;$('balance').textContent='₹'+Number(d.wallet.balance).toFixed(2);renderRecords(d.ledger||[])}catch{showAuth()}}
function renderRecords(rows){$('records').innerHTML=rows.slice(0,100).map(x=>{let m=x.meta||{};return `<div class="row"><span>${new Date(x.timestamp).toLocaleString()}</span><span>${x.type||''}</span><span>${m.choice||''}</span><span>₹${Math.abs(Number(x.amount||0)).toFixed(2)}</span></div>`}).join('')||'<div class="small">No records yet.</div>'}
async function syncRound(){try{const d=await api('/api/round');roundData=d;roundStart=d.roundStart;roundEnd=d.roundEnd;$('round').textContent=d.round;lastRound===null&&(lastRound=d.round);if(lastRound!==d.round){lastRound=d.round;$('result').textContent='—';fastStart=0} }catch(e){if(e.message.includes('Login'))showAuth()}}
function resultAngle(r){return r==='BIG'?0:r==='SMALL'?180:270}
function animate(){const now=Date.now();if(roundData){const left=roundEnd-now,elapsed=now-roundStart;const p=Math.max(0,Math.min(1,elapsed/30000));$('time').textContent=(Math.max(0,left)/1000).toFixed(1)+'s';if(left<=3000){if(!fastStart){fastStart=now;fastFrom=currentRotation;const a=resultAngle(roundData.result);let delta=((360-a-(fastFrom%360))+360)%360;delta+=360*5;targetRotation=fastFrom+delta}$('phase').textContent='FAST SPIN';const q=Math.min(1,(now-(roundEnd-3000))/3000);const e=1-Math.pow(1-q,3);currentRotation=fastFrom+(targetRotation-fastFrom)*e}else{const sec=elapsed/1000;currentRotation=sec*55;$('phase').textContent='LIGHT SPIN'}$('wheel').style.transform='rotate('+currentRotation+'deg)';if(left<=40){currentRotation=targetRotation;$('wheel').style.transform='rotate('+currentRotation+'deg)';$('result').textContent=roundData.result;fastStart=0}}requestAnimationFrame(animate)}
setInterval(syncRound,1000);setInterval(loadState,5000);requestAnimationFrame(animate);
$('bet').onclick=async()=>{if(!choice)return msg('status','Select BIG / SMALL / TIE.');if((roundEnd-Date.now())<=3000)return msg('status','Betting closed for the final 3 seconds.');try{const d=await api('/api/spin',{method:'POST',body:JSON.stringify({choice,amount,name:$('name').value.trim()})});$('balance').textContent='₹'+Number(d.wallet.balance).toFixed(2);msg('status',d.win?'WIN • payout ₹'+Number(d.payout).toFixed(2):'LOSS • Result '+d.result,d.win);$('result').textContent=d.result;loadState()}catch(e){msg('status',e.message)}};
$('recordsBtn').onclick=()=>document.querySelector('.records').scrollIntoView({behavior:'smooth'});
if(token)showApp();else showAuth();
</script></body></html>
