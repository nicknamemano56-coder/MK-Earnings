<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK Earnings Admin — Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#07101f;color:#eef4ff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#0d172b;border:1px solid #263a5d;border-radius:16px;padding:18px;margin:14px 0}.input{padding:12px;width:100%;background:#091323;color:#fff;border:1px solid #33496d;border-radius:10px;margin:5px 0}.btn{padding:11px 15px;border:0;border-radius:10px;background:#2477ff;color:#fff;font-weight:800;cursor:pointer;margin:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #223453;text-align:left}.scroll{overflow:auto;max-height:450px}.msg{min-height:20px;color:#ff8797}.muted{color:#91a2c2;font-size:12px}</style></head><body><div class="wrap"><h1>MK Earnings Admin</h1><div class="muted">Demo control panel — virtual balances only. Never use this page for real-money gambling/payment operations.</div><div class="card"><input id="key" class="input" type="password" placeholder="Admin key (Render ADMIN_KEY)"><button class="btn" onclick="saveKey()">Save Key</button><button class="btn" onclick="loadAll()">Refresh</button><div id="msg" class="msg"></div></div><div class="grid"><div class="card"><h3>Users</h3><b id="uc">0</b></div><div class="card"><h3>Ledger Rows</h3><b id="lc">0</b></div><div class="card"><h3>Round</h3><b id="round">—</b></div></div><div class="card"><h2>Demo Wallet Credit</h2><input id="gid" class="input" placeholder="Game ID"><input id="amt" class="input" type="number" placeholder="Virtual amount"><button class="btn" onclick="credit()">Add Demo Credit</button></div><div class="card"><h2>Users</h2><div class="scroll"><table><thead><tr><th>Game ID</th><th>Mobile</th><th>Balance</th><th>Wagering</th><th>Created</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="card"><h2>Recent Records</h2><div class="scroll"><table><thead><tr><th>Time</th><th>Game ID</th><th>Type</th><th>Amount</th><th>Meta</th></tr></thead><tbody id="ledger"></tbody></table></div></div><div class="card"><h2>Sequence</h2><div id="seq">—</div><button class="btn" onclick="shuffle()">Shuffle Demo Sequence</button></div></div><script>const API='https://mk-earnings-demo-backend.onrender.com';let key=localStorage.getItem('mk_admin_key')||'';document.getElementById('key').value=key;const $=id=>document.getElementById(id);const api=async(path,opt={})=>{const h={'Content-Type':'application/json','X-Admin-Key':key};const r=await fetch(API+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};function saveKey(){key=$('key').value.trim();localStorage.setItem('mk_admin_key',key);loadAll()}function show(e){$('msg').textContent=e.message||e}async function loadAll(){try{const [u,l,s,h]=await Promise.all([api('/api/admin/users'),api('/api/admin/ledger'),api('/api/admin/sequence'),fetch(API+'/api/health').then(r=>r.json())]);$('uc').textContent=u.users.length;$('lc').textContent=l.ledger.length;$('users').innerHTML=u.users.map(x=>`<tr><td>${x.gameId}</td><td>${x.mobile}</td><td>₹${Number(x.balance??x.wallet?.balance??0).toFixed(2)}</td><td>₹${Number(x.wagering??x.wallet?.wagering??0).toFixed(2)}</td><td>${new Date(x.createdAt).toLocaleString()}</td></tr>`).join('');$('ledger').innerHTML=l.ledger.slice(0,300).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.game_id}</td><td>${x.type}</td><td>${Number(x.amount).toFixed(2)}</td><td>${escapeHtml(x.meta_json||'')}</td></tr>`).join('');$('seq').textContent=`Total ${s.sequence.length} • BIG ${s.counts.BIG} • SMALL ${s.counts.SMALL} • TIE ${s.counts.TIE}`;$('round').textContent=h.globalRound?.round||'—';$('msg').textContent='Connected';$('msg').style.color='#8ff0ae'}catch(e){show(e)}}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function credit(){try{const d=await api('/api/admin/deposit',{method:'POST',body:JSON.stringify({gameId:$('gid').value.trim(),amount:Number($('amt').value)})});$('msg').textContent='Demo credit added to '+d.gameId;$('msg').style.color='#8ff0ae';loadAll()}catch(e){show(e)}}async function shuffle(){try{await api('/api/admin/shuffle',{method:'POST'});$('msg').textContent='Demo sequence shuffled';$('msg').style.color='#8ff0ae';loadAll()}catch(e){show(e)}}if(key)loadAll();</script></body></html>
