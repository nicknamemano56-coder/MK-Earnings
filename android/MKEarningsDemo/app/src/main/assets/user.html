<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MK Earnings - 30 Second Demo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  background:radial-gradient(circle at top,#17213d,#080b14 62%);
  color:#fff;
  padding:14px;
}

.wrap{
  width:min(760px,100%);
  margin:auto;
  text-align:center;
}

.brand{
  font-size:13px;
  letter-spacing:3px;
  color:#aab6d0;
  text-transform:uppercase;
}

.title{
  font-size:clamp(28px,7vw,44px);
  font-weight:900;
  margin:4px 0;
  background:linear-gradient(90deg,#fff,#8ed8ff,#fff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.sub{
  color:#98a6c0;
  margin:6px 0 10px;
}

.clockBox{
  background:#10172a;
  border:1px solid #334365;
  border-radius:14px;
  padding:10px;
  margin:10px auto;
  width:min(430px,100%);
}

.clock{
  font-size:25px;
  font-weight:1000;
  color:#8ee8ff;
}

.istLabel{
  font-size:10px;
  color:#8795b1;
  margin-top:2px;
}

.timer{
  margin-top:4px;
  font-size:14px;
  font-weight:900;
  color:#ffd166;
}

.wheelbox{
  position:relative;
  width:min(430px,92vw);
  aspect-ratio:1;
  margin:16px auto;
}

.wheel{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:9px solid #202b48;
  box-shadow:
    0 0 0 4px #070a12,
    0 18px 60px #0009;
  overflow:hidden;

  background:conic-gradient(
    #3b82f6 0deg 18deg,
    #ef4444 18deg 36deg,
    #3b82f6 36deg 54deg,
    #ef4444 54deg 72deg,
    #3b82f6 72deg 90deg,
    #ef4444 90deg 108deg,
    #3b82f6 108deg 126deg,
    #ef4444 126deg 144deg,
    #3b82f6 144deg 162deg,
    #ef4444 162deg 180deg,
    #3b82f6 180deg 198deg,
    #ef4444 198deg 216deg,
    #3b82f6 216deg 234deg,
    #ef4444 234deg 252deg,
    #3b82f6 252deg 270deg,
    #ef4444 270deg 288deg,
    #f59e0b 288deg 306deg,
    #3b82f6 306deg 324deg,
    #ef4444 324deg 342deg,
    #f59e0b 342deg 360deg
  );

  will-change:transform;
}

.pointer{
  position:absolute;
  z-index:10;
  top:-6px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:17px solid transparent;
  border-right:17px solid transparent;
  border-top:35px solid #fff;
  filter:drop-shadow(0 4px 5px #000);
}

.hub{
  position:absolute;
  z-index:11;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:82px;
  height:82px;
  border-radius:50%;
  background:#0b1020;
  border:5px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 0 25px #000;
}

.panel{
  margin-top:18px;
  background:#11182a;
  border:1px solid #263352;
  border-radius:20px;
  padding:16px;
  text-align:left;
}

.usergrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.input{
  width:100%;
  border:1px solid #2c3a5c;
  background:#0b1020;
  color:#fff;
  border-radius:10px;
  padding:12px;
  font-size:14px;
  outline:none;
}

.choiceRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.choice{
  border:0;
  border-radius:14px;
  padding:15px;
  font-size:19px;
  font-weight:900;
  color:#fff;
  cursor:pointer;
}

.big{background:#2563eb}
.small{background:#dc2626}

.tie{
  display:block;
  width:55%;
  margin:10px auto 0;
  background:#d97706;
}

.choice.selected{
  outline:3px solid #fff;
}

.amounts{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:15px;
}

.amount{
  flex:1 0 21%;
  border:1px solid #334365;
  background:#0b1020;
  color:#fff;
  border-radius:10px;
  padding:9px;
  font-weight:900;
  cursor:pointer;
}

.amount.active{
  background:#8ed8ff;
  color:#07111d;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.cancel,
.bet{
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.cancel{
  background:#29344d;
  color:#fff;
}

.bet{
  background:linear-gradient(135deg,#8ee8ff,#fff);
  color:#07111d;
}

.status{
  text-align:center;
  min-height:25px;
  margin-top:12px;
  color:#d9e4ff;
  font-weight:800;
}

.result{
  margin-top:12px;
  text-align:center;
  border:1px solid #2c3a5c;
  border-radius:14px;
  padding:14px;
  background:#0b1020;
  font-size:22px;
  font-weight:900;
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.records{
  margin-top:18px;
}

.records h3{
  margin:0 0 10px;
  text-align:center;
}

.recordList{
  max-height:360px;
  overflow:auto;
}

.record{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:10px;
  margin-bottom:7px;
  background:#0b1020;
  border:1px solid #263352;
  border-radius:10px;
}

.recordPeriod{
  font-size:11px;
  color:#7f8ca7;
}

.recordResult{
  font-weight:1000;
}

.recordResult.BIG{color:#60a5fa}
.recordResult.SMALL{color:#f87171}
.recordResult.TIE{color:#fbbf24}

.demoNote{
  font-size:11px;
  color:#7887a5;
  text-align:center;
  margin-top:12px;
  line-height:1.5;
}

@media(max-width:520px){
  .usergrid{
    grid-template-columns:1fr;
  }

  .wheelbox{
    width:min(360px,94vw);
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">MK Earnings</div>
  <div class="title">30 SECOND DEMO</div>
  <div class="sub">Virtual Demo Wheel</div>

  <!-- INDIAN TIME -->
  <div class="clockBox">
    <div class="clock" id="istClock">00:00:00</div>
    <div class="istLabel">INDIAN STANDARD TIME (IST)</div>
    <div class="timer">
      Next Result In:
      <span id="roundTimer">30</span>s
    </div>
  </div>

  <!-- WHEEL -->
  <div class="wheelbox">

    <div class="pointer"></div>

    <div class="wheel" id="wheel">

      <div class="hub" id="hub">
        MK<br>DEMO
      </div>

    </div>

  </div>

  <!-- RESULT -->
  <div class="result" id="result">
    Waiting for next result...
  </div>

  <!-- BET PANEL -->
  <div class="panel">

    <div class="usergrid">
      <input
        class="input"
        id="playerName"
        placeholder="Player Name"
      >

      <input
        class="input"
        id="playerUpi"
        placeholder="Demo UPI ID"
      >
    </div>

    <div class="choiceRow">

      <button
        class="choice big"
        data-choice="BIG">
        BIG
      </button>

      <button
        class="choice small"
        data-choice="SMALL">
        SMALL
      </button>

    </div>

    <button
      class="choice tie"
      data-choice="TIE">
      TIE
    </button>

    <div class="amounts">

      <button class="amount" data-amount="1">₹1</button>
      <button class="amount" data-amount="5">₹5</button>
      <button class="amount" data-amount="10">₹10</button>
      <button class="amount" data-amount="15">₹15</button>
      <button class="amount" data-amount="20">₹20</button>
      <button class="amount" data-amount="50">₹50</button>
      <button class="amount" data-amount="100">₹100</button>

    </div>

    <div class="actions">

      <button
        class="cancel"
        id="cancelBtn">
        CANCEL
      </button>

      <button
        class="bet"
        id="betBtn">
        BET
      </button>

    </div>

    <div
      class="status"
      id="status">
    </div>

  </div>

  <!-- RECORDS -->
  <div class="panel records">

    <h3>📜 Recent Records</h3>

    <div
      class="recordList"
      id="recordList">
    </div>

  </div>

  <div class="demoNote">
    Demo / virtual system only. No real-money payment or payout.
  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const TOTAL_RECORDS = 2880;

const BIG_COUNT = 1200;
const SMALL_COUNT = 1200;
const TIE_COUNT = 480;

const SEQUENCE_KEY =
  'mk_demo_2880_sequence_v1';

const SEQUENCE_TIME_KEY =
  'mk_demo_2880_sequence_time_v1';

const RECORDS_KEY =
  'mk_demo_user_records_v1';

const ROUND_KEY =
  'mk_demo_current_round_v1';


/* =====================================================
   ELEMENTS
===================================================== */

const wheel =
  document.getElementById('wheel');

const resultEl =
  document.getElementById('result');

const timerEl =
  document.getElementById('roundTimer');

const clockEl =
  document.getElementById('istClock');

const statusEl =
  document.getElementById('status');

const recordList =
  document.getElementById('recordList');

const betBtn =
  document.getElementById('betBtn');

const cancelBtn =
  document.getElementById('cancelBtn');


/* =====================================================
   STATE
===================================================== */

let selectedChoice = '';

let selectedAmount = 1;

let busy = false;

let roundTimer = 30;

let rotation = 0;


/* =====================================================
   2880 SEQUENCE
===================================================== */

function makeSequence(){

  const arr = [];

  for(let i=0;i<BIG_COUNT;i++){
    arr.push('BIG');
  }

  for(let i=0;i<SMALL_COUNT;i++){
    arr.push('SMALL');
  }

  for(let i=0;i<TIE_COUNT;i++){
    arr.push('TIE');
  }

  return shuffle(arr);
}


function shuffle(arr){

  const a = [...arr];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }

  return a;
}


function getSequence(){

  const saved =
    localStorage.getItem(
      SEQUENCE_KEY
    );

  const savedTime =
    Number(
      localStorage.getItem(
        SEQUENCE_TIME_KEY
      ) || 0
    );

  const now =
    Date.now();

  /*
    24 hour automatic refresh
  */

  if(
    !saved ||
    !Array.isArray(
      parseSequence(saved)
    ) ||
    now-savedTime >=
      24*60*60*1000
  ){

    const sequence =
      makeSequence();

    localStorage.setItem(
      SEQUENCE_KEY,
      JSON.stringify(sequence)
    );

    localStorage.setItem(
      SEQUENCE_TIME_KEY,
      String(now)
    );

    return sequence;

  }

  return parseSequence(saved);

}


function parseSequence(value){

  try{

    const a =
      JSON.parse(value);

    if(
      Array.isArray(a) &&
      a.length===TOTAL_RECORDS
    ){
      return a;
    }

  }catch(e){}

  return null;
}


/* =====================================================
   CURRENT ROUND
===================================================== */

function getRound(){

  const n =
    Number(
      localStorage.getItem(
        ROUND_KEY
      ) || 0
    );

  return Math.max(
    0,
    Math.floor(n)
  );
}


function setRound(n){

  localStorage.setItem(
    ROUND_KEY,
    String(n)
  );

}


/* =====================================================
   IST CLOCK
===================================================== */

function updateIST(){

  const now =
    new Date();

  const text =
    new Intl.DateTimeFormat(
      'en-IN',
      {
        timeZone:'Asia/Kolkata',
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit',
        hour12:false
      }
    ).format(now);

  clockEl.textContent =
    text;

}

setInterval(
  updateIST,
  1000
);

updateIST();


/* =====================================================
   WHEEL
===================================================== */

function spinWheel(result){

  let index;

  if(result==='BIG'){

    index =
      Math.floor(
        Math.random()*8
      )*2;

  }else if(result==='SMALL'){

    index =
      Math.floor(
        Math.random()*8
      )*2+1;

  }else{

    index =
      Math.random()<.5
        ? 16
        : 19;

  }

  const sliceAngle =
    18;

  const target =
    index*sliceAngle;

  rotation +=
    360*6 +
    (360-target);

  wheel.style.transition =
    'transform 5s cubic-bezier(.12,.75,.15,1)';

  wheel.style.transform =
    `rotate(${rotation}deg)`;

}


/* =====================================================
   RECORDS
===================================================== */

function getRecords(){

  try{

    return JSON.parse(
      localStorage.getItem(
        RECORDS_KEY
      ) || '[]'
    );

  }catch(e){

    return [];

  }

}


function saveRecord(result,period){

  const records =
    getRecords();

  records.unshift({

    period,

    result,

    time:new Date().toLocaleString(
      'en-IN',
      {
        timeZone:'Asia/Kolkata'
      }
    )

  });

  /*
    Keep latest 100 records
    on user screen.
  */

  localStorage.setItem(
    RECORDS_KEY,
    JSON.stringify(
      records.slice(0,100)
    )
  );

  renderRecords();

}


function renderRecords(){

  const records =
    getRecords();

  if(!records.length){

    recordList.innerHTML =
      '<div class="muted">No records yet.</div>';

    return;

  }

  recordList.innerHTML =
    records.map(r=>`

      <div class="record">

        <div>

          <div class="recordPeriod">
            Period ${escapeHtml(r.period)}
          </div>

          <div class="muted">
            ${escapeHtml(r.time || '')}
          </div>

        </div>

        <div
          class="recordResult ${escapeHtml(r.result)}">
          ${escapeHtml(r.result)}
        </div>

      </div>

    `).join('');

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =====================================================
   RESULT
===================================================== */

function playNextResult(){

  if(busy){

    return;

  }

  busy=true;

  const sequence =
    getSequence();

  let round =
    getRound();

  /*
    2880 rounds/day
  */

  if(round>=TOTAL_RECORDS){

    const newSequence =
      makeSequence();

    localStorage.setItem(
      SEQUENCE_KEY,
      JSON.stringify(
        newSequence
      )
    );

    localStorage.setItem(
      SEQUENCE_TIME_KEY,
      String(
        Date.now()
      )
    );

    round=0;

  }

  const result =
    sequence[round];

  setRound(
    round+1
  );

  resultEl.textContent =
    'Spinning...';

  spinWheel(result);

  setTimeout(()=>{

    resultEl.textContent =
      `RESULT: ${result}`;

    saveRecord(
      result,
      round+1
    );

    statusEl.textContent =
      `Demo Result: ${result}`;

    busy=false;

  },5000);

}


/* =====================================================
   30 SECOND TIMER
===================================================== */

function tickTimer(){

  roundTimer--;

  if(roundTimer<0){

    roundTimer=30;

    playNextResult();

  }

  timerEl.textContent =
    String(roundTimer);

}

setInterval(
  tickTimer,
  1000
);


/* =====================================================
   BET SELECTION
===================================================== */

document
.querySelectorAll('.choice')
.forEach(btn=>{

  btn.addEventListener(
    'click',
    ()=>{

      document
      .querySelectorAll('.choice')
      .forEach(x=>
        x.classList.remove(
          'selected'
        )
      );

      btn.classList.add(
        'selected'
      );

      selectedChoice =
        btn.dataset.choice;

    }
  );

});


document
.querySelectorAll('.amount')
.forEach(btn=>{

  btn.addEventListener(
    'click',
    ()=>{

      document
      .querySelectorAll('.amount')
      .forEach(x=>
        x.classList.remove(
          'active'
        )
      );

      btn.classList.add(
        'active'
      );

      selectedAmount =
        Number(
          btn.dataset.amount
        );

    }
  );

});


/* =====================================================
   DEMO BET
===================================================== */

betBtn.addEventListener(
  'click',
  ()=>{

    if(!selectedChoice){

      statusEl.textContent =
        'Please select BIG, SMALL or TIE.';

      return;

    }

    statusEl.textContent =
      `Demo bet selected: ${selectedChoice} ₹${selectedAmount}`;

  }
);


cancelBtn.addEventListener(
  'click',
  ()=>{

    selectedChoice='';

    document
    .querySelectorAll('.choice')
    .forEach(x=>
      x.classList.remove(
        'selected'
      )
    );

    statusEl.textContent =
      'Bet cancelled.';

  }
);


/* =====================================================
   INITIAL
===================================================== */

renderRecords();

getSequence();

</script>

</body>
</html>
